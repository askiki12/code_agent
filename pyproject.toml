[project]
name = "code-agent"
version = "0.1.0"
description = "A self-built coding agent"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
